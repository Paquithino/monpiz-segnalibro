# Contenuti del cartellino-segnalibro dei cappelli MonPiz, versione italiano + inglese.
# Le righe inglesi (`*_en`) vanno in corsivo sotto quelle italiane.
#   monpiz-segnalibro build --content content/segnalibro-bilingue.yaml -o dist/MonPiz-Segnalibro-bilingue.pdf
# I percorsi delle immagini sono relativi alla cartella `assets/`.
# I testi accettano "\n" (o i blocchi YAML `|`) per forzare un a capo.

meta:
  title: MonPiz — Cartellino segnalibro cappelli (IT/EN)
  author: MonPiz
  subject: Cappelli ricamati a mano

# FORMATO ###################################################################################################
# Misure al rifilo in mm, come il segnalibro delle scarpe (4,7 x 15 cm).
format:
  width_mm: 47
  height_mm: 150
  bleed_mm: 3

# FORO per il cordino del cartellino (lo fa la tipografia: il PDF non lo stampa, lo mostra solo
# `--guides`). Il layout lascia libero lo spazio attorno. Togli la sezione se non serve il foro.
hole:
  diameter_mm: 5
  from_top_mm: 8          # dal bordo alto al centro del foro

# FRONTE: solo il logo nero + giallo, ruotato, si legge dal basso verso l'alto ##################################
front:
  logo: images/logo-giallo.png
  logo_width_mm: 34       # ingombro del logo nella larghezza del cartellino (la lunghezza segue)

# RETRO ######################################################################################################
back:
  eyebrow: Cappelli · Hats
  title: Dettagli
  title_italic: Details
  layout: grid            # grid: due per riga (fino a 4) | list: uno sotto l'altro, con descrizione lunga
  details:                # da 1 a 4. Toppe ricamate: ricamo, acqua, lana, crushable (src/.../icons.py)
    - name: Ricamati a mano
      name_en: Hand embroidered
      icon: ricamo
    - name: Impermeabili
      name_en: Waterproof
      icon: acqua
    - name: Lana 100%
      name_en: 100% wool
      icon: lana
    - name: Pieghevoli
      name_en: Crushable
      icon: crushable
  note: Non buttare questo cartellino, usalo come segnalibro.
  note_en: Keep this tag and use it as a bookmark.
  skyline: false          # la linea gialla delle montagne sopra la nota
  qr:                     # da 0 a 2, affiancati in basso
    - url: https://www.monpiz.it
      label: monpiz.it
    - url: https://www.instagram.com/monpiz_official/
      label: "@monpiz_official"
  footer: MonPiz ti accompagna nella tua lettura.
  footer_en: MonPiz keeps you company while you read.
